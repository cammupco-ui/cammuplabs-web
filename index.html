<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMMUPLABS — We build the technology of questions.</title>
  <meta name="description" content="CAMMUPLABS researches questions. We build technology that reconnects conversations and lets sincerity travel between people.">
  <link rel="canonical" href="https://cammuplabs.com">
  <meta property="og:url" content="https://cammuplabs.com">
  <meta property="og:site_name" content="CAMMUPLABS">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anta&family=Inter:wght@300;400;500;600&family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FDF7F1; --ink: #211C19; --pink: #FF0051;
      --navy: #1E2A44; --muted: #6B6159; --border: #EDE5DB;
    }
    html, body { height: 100%; overflow: hidden; background: var(--cream); color: var(--ink); }
    body { font-family: 'Alexandria', sans-serif; }

    /* ── NAV ── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 68px;
      transition: background 0.35s, border-color 0.35s;
      border-bottom: 1px solid transparent;
    }
    #nav.bg-light { background: rgba(253,247,241,0.88); backdrop-filter: blur(14px); border-bottom-color: var(--border); }
    #nav.bg-dark  { background: rgba(33,28,25,0.88);  backdrop-filter: blur(14px); border-bottom-color: rgba(255,255,255,0.1); }

    /* inner wrapper — max-width + padding */
    #nav-inner {
      max-width: 1440px; min-width: 320px;
      margin: 0 auto; height: 100%;
      display: flex; align-items: center;
      padding: 0 80px; gap: 32px;
      position: relative;
    }

    .nav-logo { flex-shrink: 0; line-height: 0; }
    .nav-logo svg { color: var(--ink); transition: color 0.35s; }
    #nav.bg-dark .nav-logo svg { color: white; }

    /* desktop links — absolutely centered in nav */
    .nav-links {
      display: flex; align-items: center; gap: 36px;
      position: absolute; left: 50%; transform: translateX(-50%);
    }
    .nav-links a { font-size: 13px; font-weight: 500; text-decoration: none; color: var(--ink); opacity: 0.65; transition: opacity 0.15s; }
    .nav-links a:hover { opacity: 1; }
    #nav.bg-dark .nav-links a { color: white; }

    .nav-right { display: flex; align-items: center; gap: 16px; margin-left: auto; }

    #lang-btn {
      background: none; border: none; cursor: pointer; font-size: 12px;
      font-weight: 500; color: var(--ink); display: flex; gap: 3px; align-items: center;
    }
    #nav.bg-dark #lang-btn { color: white; }
    #lang-btn .sep { color: var(--muted); }
    #lang-btn .active { font-weight: 700; }
    #lang-btn .inactive { color: var(--muted); }

    .nav-cta {
      padding: 8px 20px; background: var(--ink); color: white;
      border-radius: 100px; font-size: 13px; font-weight: 500;
      text-decoration: none; transition: opacity 0.15s; white-space: nowrap;
    }
    .nav-cta:hover { opacity: 0.72; }
    #nav.bg-dark .nav-cta { background: white; color: var(--ink); }

    /* ── HAMBURGER BUTTON ── */
    #hamburger {
      display: none;
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--ink); border: none; cursor: pointer;
      flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      flex-shrink: 0; transition: opacity 0.15s;
    }
    #hamburger:hover { opacity: 0.78; }
    #hamburger span {
      display: block; width: 20px; height: 2px;
      background: white; border-radius: 2px; transition: all 0.25s;
    }
    #nav.bg-dark #hamburger { background: white; }
    #nav.bg-dark #hamburger span { background: var(--ink); }

    /* hamburger → X animation */
    #hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    #hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    #hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* ── MOBILE MENU DROPDOWN ── */
    #mobile-menu {
      position: fixed; top: 68px; right: 16px; z-index: 99;
      background: var(--ink); border-radius: 20px;
      padding: 10px; display: flex; flex-direction: column; gap: 6px;
      min-width: 200px;
      opacity: 0; pointer-events: none;
      transform: translateY(-8px) scale(0.97);
      transform-origin: top right;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #mobile-menu.open { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
    .mob-link {
      display: block; padding: 12px 20px;
      background: white; color: var(--ink);
      border-radius: 12px; font-size: 15px; font-weight: 600;
      text-decoration: none; text-align: center;
      transition: opacity 0.15s;
    }
    .mob-link:hover { opacity: 0.72; }
    .mob-cta {
      display: block; padding: 12px 20px;
      background: var(--pink); color: white;
      border-radius: 12px; font-size: 15px; font-weight: 600;
      text-decoration: none; text-align: center;
      margin-top: 4px; transition: opacity 0.15s;
    }
    .mob-cta:hover { opacity: 0.82; }

    /* ── RESPONSIVE BREAKPOINTS ── */
    @media (max-width: 1023px) {
      #nav-inner { padding: 0 24px; }
      .nav-links { display: none; }
      .nav-cta { display: none; }
      #hamburger { display: flex; }
    }
    @media (max-width: 479px) {
      #nav-inner { padding: 0 16px; }
    }
    @media (min-width: 1441px) {
      #nav-inner { padding: 0 80px; }
    }

    /* ── HERO ── */
    #sphere-bg { position: fixed; inset: 0; z-index: 0; }
    #sphere-canvas { width: 100%; height: 100%; display: block; }
    #hero-bg-img {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: url('images/hero-bg-bubbles.jpg') center center / cover no-repeat;
      opacity: 0.07;
    }
    #hero-overlay {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(253,247,241,0.18) 100%);
    }

    /* headline — centered, upper area above sphere */
    /* hero layout — flex column fills space between nav and footer */
    #hero-layout {
      position: fixed;
      top: 68px; bottom: 48px;
      left: 0; right: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      gap: 0;
      padding: 0;
      pointer-events: none;
    }
    #hero-top-space { display: none; }
    #hero-headline {
      flex-shrink: 0;
      text-align: center;
      pointer-events: none;
      margin-bottom: clamp(16px, 2.5vh, 32px);
    }
    /* sphere zone — fixed height so sphere renders snug below headline */
    #sphere-zone { flex-shrink: 0; width: 100%; height: clamp(220px, 32vh, 360px); }
    #hero-chips-pad { flex-shrink: 0; height: clamp(12px, 2vh, 24px); }
    #hero-chips-wrap {
      flex-shrink: 0;
      display: flex; justify-content: center;
      pointer-events: all;
      width: 100%;
    }
    .hero-hl {
      font-family: 'Anta', 'Alexandria', sans-serif;
      font-size: clamp(32px, 4.8vw, 72px); font-weight: 400;
      line-height: 1.08; letter-spacing: -0.01em;
      color: var(--ink);
    }
    .hero-chips {
      display: flex; flex-wrap: wrap; gap: clamp(6px, 0.6vw, 12px);
      justify-content: center; max-width: clamp(500px, 60vw, 900px);
    }
    .chip {
      padding: clamp(7px, 0.7vh, 12px) clamp(16px, 1.4vw, 28px);
      border: 1px solid var(--border); border-radius: 100px;
      font-size: clamp(12px, 1vw, 16px); font-weight: 500; color: var(--ink);
      background: rgba(253,247,241,0.65); backdrop-filter: blur(8px);
      cursor: pointer; transition: all 0.15s;
    }
    .chip:hover { border-color: var(--ink); background: var(--ink); color: white; }

    /* mobile */
    @media (max-width: 600px) {
      .hero-hl { font-size: clamp(28px, 8vw, 44px); }
      .hero-chips { flex-direction: column; align-items: center; gap: 10px; }
      .chip { width: 200px; text-align: center; }
    }
    .btn-dark {
      padding: 10px 24px; background: rgba(255,255,255,0.92); color: var(--ink);
      border-radius: 100px; font-size: 13px; font-weight: 600;
      text-decoration: none; transition: all 0.15s; cursor: pointer; border: none;
      display: inline-block; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .btn-dark:hover { background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .hero-founder {
      font-size: 12px; color: var(--muted); margin-top: 24px;
    }

    /* ── FOOTER ── */
    #site-footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: 48px;
      background: rgba(253,247,241,0.88); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
    }
    #footer-inner {
      max-width: 1440px; min-width: 320px;
      margin: 0 auto; height: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 80px;
    }
    .footer-legal {
      font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 16px;
      white-space: nowrap;
    }
    .footer-legal span { opacity: 0.7; }
    .footer-legal a { color: var(--muted); text-decoration: none; opacity: 0.7; transition: opacity 0.15s; }
    .footer-legal a:hover { opacity: 1; }
    .footer-sep { opacity: 0.35 !important; }
    .footer-talkbingo {
      display: flex; align-items: center; gap: 7px;
      text-decoration: none; padding: 5px 13px 5px 5px;
      border: 1px solid var(--border); border-radius: 100px;
      background: rgba(253,247,241,0.6); backdrop-filter: blur(8px);
      transition: all 0.15s; flex-shrink: 0;
    }
    .footer-talkbingo:hover { border-color: var(--ink); background: rgba(253,247,241,0.9); }
    .footer-talkbingo-dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--ink); opacity: 0.25; flex-shrink: 0;
    }
    .footer-talkbingo-label {
      font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em;
    }
    @media (max-width: 1023px) {
      #footer-inner { padding: 0 24px; }
      .footer-legal { gap: 10px; }
      .footer-legal .hide-mobile { display: none; }
    }
    @media (max-width: 479px) {
      #footer-inner { padding: 0 16px; }
    }

    /* ── POPUP ── */
    #popup-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(20,16,14,0.45); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #popup-overlay.open { opacity: 1; pointer-events: all; }
    #popup-panel {
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 24px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.5);
      width: 520px; max-width: calc(100vw - 48px); max-height: 78vh;
      display: flex; flex-direction: column;
      opacity: 0; transform: scale(0.06); pointer-events: none;
    }
    #popup-overlay.open #popup-panel {
      animation: popupEject 0.52s cubic-bezier(0.34,1.28,0.64,1) forwards;
      pointer-events: all;
    }
    #popup-overlay.closing #popup-panel {
      animation: popupAbsorb 0.28s cubic-bezier(0.4,0,1,1) forwards;
      pointer-events: none;
    }
    @keyframes popupEject {
      0%   { transform: scale(0.06) rotate(-4deg); opacity: 0; filter: blur(10px); }
      55%  { transform: scale(1.05) rotate(0.8deg); opacity: 1; filter: blur(0); }
      75%  { transform: scale(0.97) rotate(-0.3deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
    }
    @keyframes popupAbsorb {
      0%   { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
      100% { transform: scale(0.06) rotate(4deg); opacity: 0; filter: blur(8px); }
    }
    #popup-hdr {
      padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    #popup-title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.01em; text-shadow: 0 1px 8px rgba(0,0,0,0.3); }
    #popup-close { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    #popup-close:hover { background: rgba(255,255,255,0.28); color: #fff; }
    #popup-body { padding: 20px 24px; overflow-y: auto; font-size: 14px; color: rgba(255,255,255,0.85); line-height: 1.85; white-space: pre-line; }
    #popup-ft { padding: 16px 24px 22px; border-top: 1px solid rgba(255,255,255,0.18); }

    /* ── LANG ── */
    .kr { display: none; }
    body.is-kr .en { display: none; }
    body.is-kr .kr { display: inline; }
    body.is-kr .kr.blk { display: block; }
    body.is-kr p.kr, body.is-kr div.kr { display: block; }

    /* ── KOREAN FONT ── */
    @font-face {
      font-family: 'EliceDigitalBaeum';
      src: url('fonts/EliceDigitalBaeum_Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'EliceDigitalBaeum';
      src: url('fonts/EliceDigitalBaeum_Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    .kr { font-family: 'EliceDigitalBaeum', sans-serif; }
  </style>
</head>

// ─── POPUP LOGIC ─────────────────────────────────────────────────
let isKr = localStorage.getItem('lang') === 'kr';
if (isKr) {
  document.body.classList.add('is-kr');
  document.getElementById('en-lbl').className = 'inactive';
  document.getElementById('kr-lbl').className = 'active';
}
let _popupTimer = null;
function openPopup(p) {
  // Pre-fill content immediately
  const lang = isKr ? p.kr : p.en;
  document.getElementById('popup-title').textContent = lang.title;
  document.getElementById('popup-body').textContent  = lang.body;
  const cta = document.getElementById('popup-cta');
  cta.textContent = lang.cta;
  cta.href = p.url;

  // Cancel any pending open
  if (_popupTimer) { clearTimeout(_popupTimer); _popupTimer = null; }

  // Step 1: Fire 3D event NOW — no overlay yet, fully visible
  if (typeof triggerSphereEject === 'function') triggerSphereEject();

  // Step 2: After 650ms (shockwave rings at peak), bring in the popup
  _popupTimer = setTimeout(() => {
    _popupTimer = null;
    const overlay = document.getElementById('popup-overlay');
    overlay.classList.remove('closing');
    void overlay.offsetWidth;
    overlay.classList.add('open');
  }, 650);
}
function closePopup(e) {
  if (!e || e.target === document.getElementById('popup-overlay') || e.currentTarget.id === 'popup-close') {
    const overlay = document.getElementById('popup-overlay');
    overlay.classList.add('closing');
    if (typeof triggerSphereAbsorb === 'function') triggerSphereAbsorb();
    setTimeout(() => overlay.classList.remove('open', 'closing'), 300);
  }
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closePopup({target:document.getElementById('popup-overlay')}); });

// Compute two orthonormal basis vectors for an inclined orbit plane
function orbitBasis(normal) {
  const n = normal.clone().normalize();
  const ref = (Math.abs(n.y) < 0.85) ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
  const u = new THREE.Vector3().crossVectors(ref, n).normalize();
  const v = new THREE.Vector3().crossVectors(n, u).normalize();
  return { u, v };
}

// 3 independent circular orbits — always outside the main sphere

const SAT_DEFS = [
  { hue:0.94, speed:0.44, radius:ORBIT_DIST,      normal:new THREE.Vector3(0.15,1.0,0.1),  startPhase:0   }, // TalkBingo — soft pink
  { hue:0.60, speed:0.73, radius:ORBIT_DIST*1.18, normal:new THREE.Vector3(0.9,0.35,0.2),  startPhase:2.1 }, // Debate — soft blue
  { hue:0.33, speed:0.26, radius:ORBIT_DIST*1.05, normal:new THREE.Vector3(0.15,0.25,1.0), startPhase:4.2 }, // Community — soft sage
];

const satellites = SAT_DEFS.map(def => {

    color:0xffffff, transparent:true, opacity:0.75,
    transmission:0.92, thickness:0.4, roughness:0.05,
    ior:1.48, envMap:envTex, side:THREE.DoubleSide

    wireframe:true, transparent:true, opacity:0.70,
    blending:THREE.AdditiveBlending
  });
  const { u, v } = orbitBasis(def.normal);
  const group = new THREE.Group();
  group.add(new THREE.Mesh(satGeo, mat));
  group.add(new THREE.Mesh(satWireGeo, wireMat));
  // start position on its own orbit plane
  group.position.copy(centralSphere.position)
    .addScaledVector(u, Math.cos(def.startPhase) * def.radius)
    .addScaledVector(v, Math.sin(def.startPhase) * def.radius);
  scene.add(group);
  return { group, mat, wireMat, u, v, hue: def.hue, phase: def.startPhase, speed: def.speed, radius: def.radius };
});

const initWaterPos=Array.from(waterGeo.attributes.position.array);
const waterMat=new THREE.MeshPhysicalMaterial({color:0x6E6A64,transparent:true,opacity:0.85,roughness:0.08,metalness:0.96,ior:1.33,transmission:0.4,clearcoat:1,clearcoatRoughness:0.08,iridescence:0.6,iridescenceIOR:1.3,iridescenceThicknessRange:[100,300]});
const waterMesh=new THREE.Mesh(waterGeo,waterMat); waterMesh.position.set(0,-3.2,0); scene.add(waterMesh);

function makeBubbleTex(word){
  const c=document.createElement('canvas'); c.width=512; c.height=256;
  const ctx=c.getContext('2d');
  const x=20,y=20,w=472,h=180,r=32;
  ctx.shadowColor='rgba(0,0,0,0.15)'; ctx.shadowBlur=8; ctx.shadowOffsetY=4;
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(256+24,y+h); ctx.lineTo(256,y+h+24); ctx.lineTo(256-24,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fill();
  ctx.shadowColor='transparent'; ctx.strokeStyle='rgba(200,190,185,0.9)'; ctx.lineWidth=3.5; ctx.stroke();
  ctx.beginPath(); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.arc(x+r,y+r,r-2,Math.PI,Math.PI*1.5); ctx.stroke();
  ctx.font='500 36px Inter,-apple-system,sans-serif'; ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(255,255,255,0.5)'; ctx.shadowBlur=6;
  ctx.fillText(word,256,y+h/2);
  const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter; return tex;
}

let activeBubbles=[];
function spawnBubbles(count){
  for(let i=0;i<count;i++){
    const theta=Math.random()*Math.PI*2, phi=Math.random()*Math.PI;
    const sp=new THREE.Vector3(centralSphere.position.x+SPHERE_RADIUS*Math.sin(phi)*Math.cos(theta),centralSphere.position.y+SPHERE_RADIUS*Math.cos(phi),centralSphere.position.z+SPHERE_RADIUS*Math.sin(phi)*Math.sin(theta));
    const dir=sp.clone().sub(centralSphere.position).normalize();
    const vel=dir.clone().multiplyScalar(0.02+Math.random()*0.04);
    vel.x+=(Math.random()-0.5)*0.02; vel.y+=(Math.random()-0.5)*0.02; vel.z+=(Math.random()-0.5)*0.02;
    const perp=new THREE.Vector3();
    if(Math.abs(dir.x)<0.9)perp.set(1,0,0);else perp.set(0,1,0);
    perp.cross(dir).normalize();
    const word=bubbleWords[Math.floor(Math.random()*bubbleWords.length)];
    const mat=new THREE.MeshBasicMaterial({map:makeBubbleTex(word),transparent:true,depthWrite:false,side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1.2,0.6),mat);
    const s=0.6+Math.random()*0.7; mesh.scale.set(s,s,s); mesh.position.copy(sp); scene.add(mesh);
    activeBubbles.push({mesh,vel,perp,basePos:sp.clone(),baseScale:s,birth:performance.now(),life:4000+Math.random()*2000,wobbleSpeed:1.5+Math.random()*1.5});
  }
}

let shockwaves=[];
const flashLight=new THREE.PointLight(0xEC4899,0,12); scene.add(flashLight);
let lastLogoFlash=0, lastImpact=0, impactDir=new THREE.Vector3(), impactIntensity=0;

// ─── ORBIT PHASE (variable speed) ─────────────────────────────
// orbitPhase removed — each satellite now has its own sat.phase
let orbitSpeedMult = 1.0;
let satBurstEnd = 0;
let satAbsorbEnd = 0;

// ─── SPHERE EJECT (popup open) ────────────────────────────────
function triggerSphereEject() {
  satBurstEnd = performance.now() + 1600;
  lastLogoFlash = performance.now();
  flashLight.position.copy(centralSphere.position);
  flashLight.intensity = 7;
  const colors = [0xffffff, 0xEC4899, 0xffffff];
  for (let r = 0; r < 3; r++) {
    (function(idx){ setTimeout(() => {
      const pts = [];
      for (let i = 0; i <= 64; i++) { const a=(i/64)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*0.12,Math.sin(a)*0.12,0)); }
      const ring = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: colors[idx], transparent:true, opacity:1.0, blending:THREE.AdditiveBlending, depthWrite:false })
      );
      ring.position.copy(centralSphere.position);
      ring.lookAt(camera.position);
      scene.add(ring);
      shockwaves.push({ mesh:ring, birth:performance.now(), life:900 });
    }, idx * 110); })(r);
  }
  spawnBubbles(9);
}

// ─── SPHERE ABSORB (popup close) ──────────────────────────────
function triggerSphereAbsorb() {
  satAbsorbEnd = performance.now() + 900;
  lastLogoFlash = performance.now();
  flashLight.position.copy(centralSphere.position);
  flashLight.intensity = 3;
  const pts = [];
  for (let i = 0; i <= 64; i++) { const a=(i/64)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*0.5,Math.sin(a)*0.5,0)); }
  const ring = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0xEC4899, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  ring.position.copy(centralSphere.position);
  ring.lookAt(camera.position);
  scene.add(ring);
  // absorb ring shrinks instead of growing (custom type)
  shockwaves.push({ mesh:ring, birth:performance.now(), life:600, absorb:true });
}

function triggerClick(hitPoint,normal){
  flashLight.position.copy(hitPoint); flashLight.intensity=7;
  const pts=[]; for(let i=0;i<=48;i++){const a=(i/48)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*0.06,Math.sin(a)*0.06,0));}
  const ring=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false}));
  ring.position.copy(hitPoint).addScaledVector(normal,0.03); ring.lookAt(ring.position.clone().add(normal));
  scene.add(ring); shockwaves.push({mesh:ring,birth:performance.now(),life:650});
  spawnBubbles(11); lastLogoFlash=performance.now();
}

let mouseX=innerWidth/2, mouseY=innerHeight/2, hasMouseMoved=false, mouseInWindow=true;
window.addEventListener('pointermove',e=>{mouseX=e.clientX;mouseY=e.clientY;hasMouseMoved=true;mouseInWindow=true;externalTarget=null;});
window.addEventListener('pointerleave',()=>mouseInWindow=false);
window.addEventListener('pointerenter',()=>mouseInWindow=true);

const raycaster=new THREE.Raycaster(), mouse2d=new THREE.Vector2();
window.addEventListener('pointerdown',e=>{
  mouse2d.x=(e.clientX/innerWidth)*2-1; mouse2d.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse2d,camera);
  const hits=raycaster.intersectObject(centralSphere);
  if(hits.length){const pt=hits[0].point,normal=pt.clone().sub(centralSphere.position).normalize();lastImpact=performance.now();impactDir.copy(normal);impactIntensity=0.38;lastLogoFlash=performance.now();triggerClick(pt,normal);}
});

const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const now=performance.now(), delta=clock.getDelta(), elapsed=clock.getElapsedTime();
  let compress=0;
  if(lastImpact>0){const t=(now-lastImpact)/1000;if(t<0.8){compress=impactIntensity*Math.exp(-t*6.5)*Math.sin(t*22);}else lastImpact=0;}
  const posAttr=sphereGeo.attributes.position, posArr=posAttr.array;
  if(Math.abs(compress)>0.001){
    const localDir=impactDir.clone().applyMatrix4(new THREE.Matrix4().copy(centralSphere.matrixWorld).invert()).normalize();
    for(let i=0;i<posAttr.count;i++){const v=new THREE.Vector3(initSpherePos[i*3],initSpherePos[i*3+1],initSpherePos[i*3+2]);const d=1-compress*v.clone().normalize().dot(localDir);posArr[i*3]=initSpherePos[i*3]*d;posArr[i*3+1]=initSpherePos[i*3+1]*d;posArr[i*3+2]=initSpherePos[i*3+2]*d;}
  } else { for(let i=0;i<posAttr.count*3;i++) posArr[i]=initSpherePos[i]; }
  posAttr.needsUpdate=true; sphereGeo.computeVertexNormals();

  let influence=0,tRX=0,tRY=0;
  if(hasMouseMoved){
    const sv=centralSphere.position.clone().project(camera), rect=renderer.domElement.getBoundingClientRect();
    const scx=rect.left+(sv.x*0.5+0.5)*rect.width, scy=rect.top+(-sv.y*0.5+0.5)*rect.height;
    const dist=Math.hypot(mouseX-scx,mouseY-scy); influence=1-Math.min(dist/300,1);
    tRY=(mouseX-scx)*0.003; tRX=(mouseY-scy)*0.003;
  }
  centralSphere.rotation.x+=0.045*delta*(1-influence)+(tRX-centralSphere.rotation.x)*0.05*influence;
  centralSphere.rotation.y+=0.11*delta*(1-influence)+tRY*0.05*influence;
  outerWire.rotation.x=centralSphere.rotation.x; outerWire.rotation.y-=0.16*delta*(1-influence); outerWire.rotation.z+=0.06*delta;

  const pulse=1+Math.sin(elapsed*0.8)*0.033;
  centralSphere.scale.setScalar(pulse); outerWire.scale.setScalar(pulse); orbitRing.scale.setScalar(pulse);

  // orbit speed burst decay
  const burstActive = now < satBurstEnd;
  const absorbActive = now < satAbsorbEnd;
  if (burstActive) {
    const bp = (now - (satBurstEnd - 1600)) / 1600;
    orbitSpeedMult = 1.0 + 5.0 * Math.exp(-bp * 3.5);
  } else if (absorbActive) {
    const ap = (now - (satAbsorbEnd - 900)) / 900;
    orbitSpeedMult = 1.0 + 2.5 * Math.exp(-ap * 4.0);
  } else {
    orbitSpeedMult = 1.0;
  }
  // individual sat.phase increments happen inside the satellites.forEach below

  satellites.forEach(sat => {
    // Each satellite advances its own phase at its own speed
    sat.phase += delta * sat.speed * orbitSpeedMult;
    const dist = sat.radius * pulse;
    // Perfect circle — always stays on the surface of its orbital sphere
    const tp = centralSphere.position.clone()
      .addScaledVector(sat.u, Math.cos(sat.phase) * dist)
      .addScaledVector(sat.v, Math.sin(sat.phase) * dist);
    sat.group.position.lerp(tp, 0.04);
    sat.group.rotation.y += 0.8 * delta;
    sat.group.rotation.x += 0.3 * delta;
    const depth = (sat.group.position.z - centralSphere.position.z) / SPHERE_RADIUS;
    sat.group.scale.setScalar(THREE.MathUtils.mapLinear(depth,-1,1,0.4,1.0) * pulse);
    const op = THREE.MathUtils.mapLinear(depth,-1,1,0.35,1.0);
    // Gentle brightness breathing — each satellite on its own rhythm
    const brightness = 0.52 + Math.sin(elapsed * 0.85 + satellites.indexOf(sat) * 2.1) * 0.20;
    sat.wireMat.color.setHSL(sat.hue, 0.60, brightness);
    sat.wireMat.opacity = op * 0.72;
    sat.mat.opacity    = op * 0.6;
    sat.group.renderOrder = depth < -0.3 ? 0 : 10;
  });

  logoMesh.lookAt(camera.position); logoMesh.scale.setScalar(pulse);
  // Core light — solid white fill, gentle opacity breathe
  const breathe = 0.82 + Math.sin(elapsed * 1.4) * 0.18;
  logoMat.color.setRGB(1, 1, 1);
  logoMat.opacity = breathe;
  // Click burst
  const tsf = now - lastLogoFlash;
  if(tsf < 300){ const p = tsf/300; logoMat.opacity = 1.0; logoMat.color.setRGB(1,1,1); }

  // Background sphere — slow drift rotation
  bgSphere.rotation.y += delta * 0.018;
  bgSphere.rotation.x += delta * 0.007;

  // Glow faces — random triangles light up and fade
  glowFaces.forEach(face => {
    face.timer -= delta;
    if (face.phase === 'idle' && face.timer <= 0) {
      const tri = bgTris[Math.floor(Math.random() * bgTris.length)];
      const pos = face.mesh.geometry.attributes.position;
      pos.setXYZ(0, tri[0].x, tri[0].y, tri[0].z);
      pos.setXYZ(1, tri[1].x, tri[1].y, tri[1].z);
      pos.setXYZ(2, tri[2].x, tri[2].y, tri[2].z);
      pos.needsUpdate = true;
      face.mat.opacity = 0;
      face.phase = 'fadein';
      face.timer = 1.0 + Math.random() * 2.0; // hold duration
    }
    if (face.phase === 'fadein') {
      face.mat.opacity = Math.min(face.mat.opacity + delta * 0.06, 0.038);
      if (face.mat.opacity >= 0.038) { face.mat.opacity = 0.038; face.phase = 'hold'; }
    } else if (face.phase === 'hold' && face.timer <= 0) {
      face.phase = 'fadeout';
    } else if (face.phase === 'fadeout') {
      face.mat.opacity = Math.max(face.mat.opacity - delta * 0.065, 0);
      if (face.mat.opacity <= 0) { face.phase = 'idle'; face.timer = 2.5 + Math.random() * 5.5; }
    }
  });

  const wAttr=waterGeo.attributes.position, wArr=wAttr.array;
  for(let i=0;i<wAttr.count;i++){const vx=initWaterPos[i*3],vz=initWaterPos[i*3+1];wArr[i*3+2]=Math.sin(vx*0.08+elapsed*1.2)*0.045+Math.cos(vz*0.075-elapsed*1.08)*0.034+Math.sin((vx+vz)*0.045+elapsed*1.56)*0.023;}
  waterGeo.computeVertexNormals(); wAttr.needsUpdate=true;

  shockwaves=shockwaves.filter(s=>{const p=(now-s.birth)/s.life;if(p>=1){scene.remove(s.mesh);s.mesh.geometry.dispose();s.mesh.material.dispose();return false;}if(s.absorb){const sc=Math.max(0.05,(1-p)*5+0.05);s.mesh.scale.set(sc,sc,1);s.mesh.material.opacity=p<0.3?p*3*0.7:(1-p)*0.7;}else{s.mesh.scale.set(1+p*6,1+p*6,1);s.mesh.material.opacity=(1-p)*0.9;}return true;});
  if(flashLight.intensity>0.05)flashLight.intensity-=38*delta; else flashLight.intensity=0;

  activeBubbles=activeBubbles.filter(b=>{
    const progress=(now-b.birth)/b.life; if(progress>=1){scene.remove(b.mesh);b.mesh.geometry.dispose();b.mesh.material.map&&b.mesh.material.map.dispose();b.mesh.material.dispose();return false;}
    b.basePos.add(b.vel.clone().multiplyScalar(delta*60)); b.mesh.position.copy(b.basePos);
    b.mesh.position.addScaledVector(b.perp,Math.sin(elapsed*b.wobbleSpeed)*0.008);
    b.mesh.quaternion.copy(camera.quaternion); b.mesh.material.opacity=(1-progress)*0.85; return true;
  });

  camera.position.x=THREE.MathUtils.lerp(camera.position.x,Math.sin(elapsed*0.1)*1.8,delta*2);
  camera.position.y=THREE.MathUtils.lerp(camera.position.y,1.8+Math.cos(elapsed*0.14)*0.4,delta*2);
  camera.position.z=THREE.MathUtils.lerp(camera.position.z,BASE_CAM_Z()+Math.sin(elapsed*0.08)*1.2,delta*2);
  camera.lookAt(0,0.45,0);
  renderer.render(scene,camera);
}
tick();

// ─── SPHERE VERTICAL CENTERING ───────────────────────────────────
// Positions the sphere so it sits exactly in the center of #sphere-zone
// (the flex spacer between the headline and the chip buttons).
function positionSphereToCenter() {
  const zone = document.getElementById('sphere-zone');
  if (!zone || !centralSphere) return;
  const rect = zone.getBoundingClientRect();
  const targetScreenY = rect.top + rect.height / 2;
  // Convert to NDC (+1 = top of screen, -1 = bottom)
  const targetNDC = 1 - (targetScreenY / window.innerHeight) * 2;
  // Iterative solver: nudge sphere.y until it projects to targetNDC
  for (let i = 0; i < 10; i++) {
    const curr = centralSphere.position.clone().project(camera).y;
    const above = new THREE.Vector3(centralSphere.position.x, centralSphere.position.y + 0.1, centralSphere.position.z).project(camera).y;
    const slope = (above - curr) / 0.1;
    if (Math.abs(slope) < 1e-6) break;
    centralSphere.position.y += (targetNDC - curr) / slope;
    if (Math.abs(targetNDC - centralSphere.position.clone().project(camera).y) < 0.002) break;
  }
  // Sync all objects attached to sphere position
  outerWire.position.copy(centralSphere.position);
  orbitRing.position.copy(centralSphere.position);
  logoMesh.position.copy(centralSphere.position);
}

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  positionSphereToCenter();
});

// Initial centering (after fonts/layout settle)
requestAnimationFrame(() => requestAnimationFrame(positionSphereToCenter));
</script>
</body>
</html>
