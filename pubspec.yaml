name: cammup_website
description: CAMMUP Company Website
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.svg

  fonts:
    - family: Alexandria
      fonts:
        - asset: fonts/Alexandria/static/Alexandria-Regular.ttf
        - asset: fonts/Alexandria/static/Alexandria-Medium.ttf
          weight: 500
        - asset: fonts/Alexandria/static/Alexandria-SemiBold.ttf
          weight: 600
        - asset: fonts/Alexandria/static/Alexandria-Bold.ttf
          weight: 700

    - family: EliceDigitalBaeum
      fonts:
        - asset: fonts/EliceDigitalBaeum_Regular.ttf
        - asset: fonts/EliceDigitalBaeum_Bold.ttf
          weight: 700
